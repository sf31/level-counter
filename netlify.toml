[build]
  publish = "dist/level-counter/browser"

[[redirects]]
  from = "/"
  to = "/it/"
  status = 302
  conditions = { Language = ["it"] }

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302

[[redirects]]
  from = "/en/*"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/it/*"
  to = "/it/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/en/index.html"
  status = 200

[[headers]]
  for = "/*.webmanifest"

  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"

[[headers]]
  for = "/en/*.webmanifest"

  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"

[[headers]]
  for = "/it/*.webmanifest"

  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"
